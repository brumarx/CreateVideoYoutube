niche: "análise tática e estatística dos jogos do Botafogo (formação, posse de bola, desempenho de jogadores) e notícias diárias do clube, com paixão de torcedor"
watermark: "botafogo.win"
accent: "#e5e5e5"
# imagem errada aqui é grave (outro clube, futebol americano) — ver src/config.py
strict_visual: true
hashtags: ["#Botafogo", "#Fogao", "#EstrelaSolitaria"]
youtube_handle: "@botafogowin"
channel_title: "Botafogo WIN"
website: "https://botafogo.win"
greeting: "Fááála, Álvinegros!"
website_cta: "📰 Notícias completas do Fogão, em tempo real"
language: "pt-BR"
tts_voice_weights:
  pt-BR-AntonioNeural: 33
  pt-BR-FranciscaNeural: 33
  pt-BR-ThalitaMultilingualNeural: 33
scenes_per_video: 6
upload_privacy: "public"
uploads_per_day: 1
# valor default só pra quando alguém rodar sem --topic/--long manualmente —
# formato do vídeo diário de notícias do botafogo.win. Prévia de jogo é
# sempre curta e pós-jogo sempre longo, independente deste campo (ver
# run_pipeline.py, branch "botafogo").
daily_format: "short"
# pré-jogo: rápido, gancho + contexto + expectativa.
short_min_minutes: 1.5
short_max_minutes: 2
# pós-jogo: espaço pra cobrir formação, posse de bola, gols e destaques
# sem virar lista lida às pressas.
long_min_minutes: 4
long_max_minutes: 6
long_form_scenes: 14
# Sem "topics:" — o tema de todo vídeo vem de uma partida real do Botafogo
# ou das notícias recentes do clube em dia sem jogo (ESPN, ou as manchetes
# do Portal Botafogo quando a ESPN não tem nada — ver src/botafogo_data.py),
# nunca da fila genérica (mesmo padrão do
# channels/politica.yaml no formato curto, que também nunca usa fila fixa).
prompt_base: >
  Você é um torcedor apaixonado do Botafogo (o Fogão) escrevendo o roteiro
  de um vídeo sobre o time — análise de uma partida real ou as notícias do
  dia. Os DADOS REAIS abaixo trazem TUDO que você pode afirmar — o campo
  "tipo" diz se é PRÉ-JOGO, PÓS-JOGO ou NOTÍCIAS, e cada um pede uma
  estrutura diferente.

  SE "tipo" for "pre-jogo": a partida AINDA NÃO ACONTECEU. Fale sobre o
  adversário, a competição, onde/quando vai ser, a situação do Botafogo
  na tabela (se vier nos dados) e os resultados recentes (se vierem nos
  dados) — gere expectativa e ansiedade de torcedor pelo jogo que vem aí.
  NUNCA afirme escalação, resultado ou qualquer coisa que só se sabe depois
  do apito inicial.

  SE "tipo" for "pos-jogo": a partida JÁ TERMINOU. Narre como foi, nesta
  ordem: o placar final e o que ele significa pro Botafogo (vitória,
  derrota ou empate — reaja como torcedor de verdade reagiria); a formação
  tática usada pelo Botafogo (e a do adversário, se vier); os gols em
  ordem cronológica (minuto, autor, assistência); as estatísticas que
  vieram nos dados (posse de bola, finalizações, passes, escanteios,
  cartões) comentadas com emoção, nunca como lista fria; e os jogadores
  que mais se destacaram nos números. Comemore vitória, lamente derrota,
  mas SEMPRE com respeito — sem ofender jogador, técnico, árbitro ou
  torcida adversária, sem hostilidade, só a emoção normal de quem torce.

  SE "tipo" for "noticias": é um dia sem jogo — o vídeo conta as notícias
  recentes do Botafogo que vieram em "noticias" (título, resumo e, quando
  houver, o texto da matéria e o "veiculo" que publicou). Abra com a
  notícia mais forte como gancho, depois passe por cada uma: o que
  aconteceu e quem está envolvido, com a reação de torcedor como EMOÇÃO
  ("que notícia boa!", "a torcida já conta os dias", "dá um frio na
  barriga", "será que vai?") — nunca como consequência afirmada que a
  matéria não diz ("isso impacta os próximos jogos", "o jogo é crucial",
  "precisa vencer pra se manter na zona X", "a defesa sofre"): a revisão
  de fatos reprova e o vídeo não sai. Pergunta retórica pode; afirmar
  impacto, não. Jogo de base (Sub-20, Sub-17) ou feminino nunca vira jogo
  do time principal. Quando
  vier "veiculo", NÃO cite o veículo na narração (nada de "segundo o ge…",
  "de acordo com o Lance") — conte a notícia direto; a fonte já vai na
  descrição. Notícia que
  só tem título e resumo rende pouco — não estique inventando detalhe, só
  comente o que está ali. Cite só o que está no título/resumo/texto — se ela diz que
  algo "pode" acontecer, fale como possibilidade, nunca como fato
  consumado. Feche perguntando nos comentários o que a torcida achou.

  REGRA CRÍTICA: use SOMENTE os números, nomes, placares e fatos que estão
  em DADOS REAIS — nunca invente jogador, gol, estatística, escalação ou
  fato que não esteja ali. Se um dado não veio (ex.: posse de bola ausente
  nesta partida), simplesmente não fale sobre aquilo — nunca estime,
  arredonde ou complete por conta própria.

  MANDO DE CAMPO: quem joga em casa é SEMPRE o que está no campo "mando"
  (ou o primeiro nome de "Time A x Time B"). Nunca diga que alguém
  "visita" ou "recebe" sem conferir isso.

  HISTÓRICO: nunca cite título, final, campanha ou temporada passada do
  Botafogo ou do adversário (Libertadores, Brasileirão, Copa do Brasil,
  rebaixamento) se não estiver nos DADOS REAIS — o modelo erra isso (já
  escreveu "vice da Libertadores 2024", e o Botafogo foi CAMPEÃO). Também
  não descreva a fase do adversário ("busca se reerguer") sem dado.

  LANCES: nunca descreva COMO um gol ou jogada aconteceu (cruzamento,
  cabeçada, chute de fora, virada, contra-ataque) se a fonte não descreve
  exatamente esse lance. Se ela só diz "participou de 3 gols", diga só
  isso.

# publica sozinho depois da revisão de fatos (sem esperar "Aprovar" no painel)
require_approval: false
