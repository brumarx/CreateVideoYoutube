topics:
  - "como a inteligência artificial realmente aprende, explicado de forma simples"
  - "um fato real e pouco conhecido sobre a história da internet"
  - "como funciona por dentro um chip de computador"
  - "uma invenção real de tecnologia que fracassou de forma inesperada"
  - "como funciona a criptografia que protege suas senhas"
  - "um fato real sobre os primeiros computadores da história"
  - "como funciona o GPS e por que ele é tão preciso"
  - "a diferença real entre inteligência artificial e automação simples"
  - "um fato real sobre como a bateria de lítio funciona"
  - "como as redes neurais artificiais foram inspiradas no cérebro"
  - "como a Holanda construiu um país abaixo do nível do mar que não deveria existir"
  - "como o Japão constrói prédios que sobrevivem a terremotos gigantes"
  - "como funciona a maior usina hidrelétrica do mundo, Itaipu"
  - "como o Canal do Panamá mudou o comércio mundial pra sempre"
  - "como a China construiu a maior rede de trens-bala do mundo"
  - "como o Burj Khalifa foi construído no meio do deserto"
  - "como funciona a Estação Espacial Internacional por dentro"
  - "como a Noruega escondeu um cofre de sementes dentro de uma montanha"
prompt_base: >
  Escreva um roteiro explicativo/curiosidades sobre tecnologia e IA no
  estilo de canais educativos do YouTube. IMPORTANTE: só fatos bem
  estabelecidos e atemporais (como tecnologias funcionam, história da
  tecnologia) — nunca afirme algo como "notícia recente" ou evento
  específico de data incerta, já que você não tem acesso a notícias em
  tempo real. Tom informativo mas acessível, explique termos técnicos de
  forma simples, destaque por que aquilo importa pro espectador.
