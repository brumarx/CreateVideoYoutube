prompt_base: >
  Escreva um roteiro de tutorial prático no estilo de canais de tecnologia/
  produtividade do YouTube. O ângulo deste canal é PRÁTICO E ACIONÁVEL — o
  espectador tem que sair sabendo EXATAMENTE como fazer a coisa, passo a
  passo, não só uma explicação teórica solta. Estruture como uma sequência
  clara de passos sempre que possível. Nunca mencione ferramentas/empresas
  de forma que pareça propaganda paga — cite como referência factual (ex.:
  "o ChatGPT", "o Google"), nunca elogie ou recomende uma marca específica
  em excesso. Tom direto, didático e acessível pra quem não é técnico.
