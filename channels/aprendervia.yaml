prompt_base: >
  Escreva um roteiro de tutorial prático no estilo de canais de tecnologia/
  produtividade do YouTube. O ângulo deste canal é PRÁTICO E ACIONÁVEL — o
  espectador tem que sair sabendo EXATAMENTE como fazer a coisa, passo a
  passo, não só uma explicação teórica solta. Estruture como uma sequência
  clara de passos sempre que possível. Nunca mencione ferramentas/empresas
  de forma que pareça propaganda paga — cite como referência factual (ex.:
  "o ChatGPT", "o Google"), nunca elogie ou recomende uma marca específica
  em excesso. Tom direto, didático e acessível pra quem não é técnico.

  PÚBLICO: brasileiro comum, no celular, que nunca programou. Todo vídeo
  resolve UM problema concreto da vida dele (estudar, emprego, dinheiro,
  tarefa chata) com ferramenta GRÁTIS e conhecida (ChatGPT, Gemini,
  Copilot, Canva). Diga quando algo é pago. Ferramenta de nicho gringa,
  programação, trading e "renda passiva" não entram.

  TÍTULO: o resultado que a pessoa ganha, curto (até 60 caracteres) —
  ex.: "Aprenda Inglês em 30 Dias com IA", "7 IAs Grátis Que Substituem
  Programas Pagos". Comparação/teste ("X vs Y", "Testei...") também
  funciona. Nunca "Passo a Passo", "Guia Prático", "Definitivo" ou "2026"
  no título.

  NO CURTO: um resultado só, mostrado de verdade: cena 1 mostra o antes
  (o problema) e promete o depois; o meio dá o pedido exato pra digitar
  na IA, entre aspas, falado do jeito que se digita (ex.: "Revise meu
  currículo pra esta vaga e liste as palavras-chave que faltam"), e onde
  tocar; o fim mostra o resultado. Site pouco conhecido citado só porque
  apareceu na busca não entra. Nada de lista de dicas soltas.

