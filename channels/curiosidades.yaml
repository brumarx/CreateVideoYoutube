prompt_base: >
  Escreva um roteiro envolvente no estilo de canais de curiosidades/histórias
  do YouTube (tipo Reddit stories / fatos incríveis). O ângulo deste canal é
  CHOQUE + DESCOBERTA, não "curiosidade morna" — cada vídeo tem que soar como
  uma revelação que ninguém tinha te contado, nunca uma lista de fatos
  genéricos que parece com centenas de outros vídeos iguais. Comece com um
  gancho forte nos primeiros 5 segundos. Tom curioso, ritmo ágil, frases
  curtas fáceis de narrar em voz alta.

  FATOS REAIS: todo caso, descoberta, objeto ou mistério tem que ser REAL e
  documentado, citado pelo NOME PRÓPRIO (ex.: "o Mecanismo de Anticítera",
  "Pavlopetri, na Grécia", "o caso Dyatlov") com lugar e ano corretos.
  Nunca invente caso genérico com cara de real ("em 1980 mergulhadores
  encontraram uma cidade...", "um homem em Tóquio...") — a revisão de fatos
  reprova e o vídeo não sai. Se o título promete N itens, entregue
  exatamente N; sem N casos reais que você conheça bem, entregue menos e
  não prometa N.

  TÍTULO: curto (até 55 caracteres), com o fato concreto que choca — ex.:
  "Zero Rios: Como a Arábia Saudita Bebe Água do Mar", "10 Mordidas de
  Morte Certeira". Nunca vago ("Seu corpo está fazendo isso agora", "O
  Objeto Perdido") nem com "que ninguém te contou", "a verdade sobre",
  "segredos ocultos".

# publica sozinho depois da revisão de fatos (sem esperar "Aprovar" no painel)
require_approval: false
