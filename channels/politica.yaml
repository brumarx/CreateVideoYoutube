niche: "curiosidades factuais sobre política brasileira (dados públicos oficiais: TSE, Câmara, Senado, Portal da Transparência)"
watermark: "@NúmerosdaRepública"
accent: "#8c8cff"
hashtags: ["#Politica", "#Brasil", "#NumerosDaRepublica"]
youtube_handle: "@numerosdarepublica"
channel_title: "Números da República"
language: "pt-BR"
tts_voice_weights:
  pt-BR-AntonioNeural: 100
  pt-BR-FranciscaNeural: 0
  pt-BR-ThalitaMultilingualNeural: 0
scenes_per_video: 7
upload_privacy: "public"
uploads_per_day: 1
daily_format: "long"
short_min_minutes: 1
short_max_minutes: 2
long_min_minutes: 6
long_max_minutes: 8
# formato curto ignora esta lista de temas — usa sempre um fato real
# aleatório do banco de transparência (ver src/politica_data.py), pra nunca
# inventar número/nome sobre gente real. Só o formato longo consome a fila
# abaixo, e só com temas de FUNCIONAMENTO do sistema (não sobre pessoas
# específicas) — sem o grounding de dados reais do short, um roteiro de
# 15-20min sem essa base seria arriscado demais sobre gente real.
long_form_scenes: 24
topics:
  - "como funciona a cota parlamentar (CEAP) explicada do zero"
  - "como funciona o financiamento de campanhas eleitorais no Brasil"
  - "como funciona o processo eleitoral brasileiro, do voto à posse"
  - "como funciona o sistema de emendas parlamentares no Brasil"
  - "como funciona a fiscalização de gastos públicos no Brasil"
  - "como funciona a Lei da Ficha Limpa e o que ela realmente proíbe"
  - "Quanto os políticos brasileiros realmente ganham?"
prompt_base: >
  Escreva um roteiro de curiosidades sobre política brasileira usando SOMENTE
  os dados fornecidos abaixo (não invente nomes, valores ou fatos que não
  estejam na lista). O ângulo deste canal é DINHEIRO + PODER + NOMES — seja
  direto sobre quem, quanto e onde, sem preâmbulo institucional ("hoje vamos
  falar sobre..."). Isso NÃO muda a regra de neutralidade abaixo: ser direto
  com os números é diferente de insinuar culpa. Tom neutro e factual, sem
  opinião partidária, sem acusação — apresente os números como "segundo
  declaração ao TSE" ou "segundo dados abertos da Câmara/Senado", nunca como
  fato absoluto confirmado por nós.

  REGRA CRÍTICA de ritmo: NUNCA vire uma lista lida em voz alta ("Fulano
  gastou X, Beltrano gastou Y, Cicrano gastou Z..."). Cada cena precisa de
  uma reação/comentário em cima do dado, não só o dado cru — destaque o que
  aquele número tem de surpreendente, inusitado ou fora da curva, faça uma
  pergunta retórica, compare um item com outro da própria lista, ou crie
  tensão pro próximo ("mas o próximo valor é ainda mais chocante"). Varie a
  estrutura da frase a cada cena — nunca repita o mesmo molde ('nome +
  verbo + valor') duas cenas seguidas. Gancho forte no início, ritmo ágil,
  linguagem acessível para quem não acompanha política de perto.
