  - "como funciona o sistema de emendas parlamentares no Brasil"
  - "como funciona a fiscalização de gastos públicos no Brasil"
  - "como funciona a Lei da Ficha Limpa e o que ela realmente proíbe"
  - "Quanto os políticos brasileiros realmente ganham?"
  - "O que acontece com o mandato de um congressista que se afasta para assumir cargo no Executivo"
  - "Como o Senado Federal é composto e como o regimento interno define a hierarquia entre os senadores"
  - "Como o Portal da Transparência permite rastrear cada centavo gasto pelos parlamentares em diárias e passagens aéreas"
  - "Quais são os fatos curiosos sobre os recursos financeiros compartilhados entre as Câmaras no Brasil?"
  - "Por que deputados e senadores não podem ser presos sem ordem do tribunal de origem"
  - "O papel e o funcionamento das Comissões Parlamentares de Inquérito (CPI) no Congresso Nacional."
  - "Como o Tribunal de Contas da União calcula e devolve o dinheiro economizado pelo Fundo Partidário"
  - "Como o sistema de apuração eletrônica do TSE garante a integridade do voto por meio de auditorias de segurança e provas lógicas"
  - "Como o processo legislativo funciona na apreciação e aprovação da Código de Conduta dos Parlamentares no Brasil?"
  - "Como o sistema de renúncia fiscal permite que empresas paguem menos impostos em troca de investimentos aprovados por parlamentares"
prompt_base: >
  Escreva um roteiro de curiosidades sobre política brasileira. SE houver uma
  seção "DADOS REAIS" abaixo (formato curto): use SOMENTE esses dados (não
  invente nomes, valores ou fatos que não estejam na lista) — o ângulo é
  DINHEIRO + PODER + NOMES, seja direto sobre quem, quanto e onde, sem
  preâmbulo institucional ("hoje vamos falar sobre..."). SE NÃO houver essa
  seção (formato longo, tema sobre COMO O SISTEMA FUNCIONA, não sobre pessoa
  específica): escreva com base no seu conhecimento geral, bem estabelecido e
  público sobre leis e processos brasileiros (o que a CEAP cobre, limites
  legais, como funciona o processo eleitoral etc.) — isso é conhecimento de
  domínio público, não precisa de lista de dados pra ser usado; só não invente
  número específico, nome de pessoa ou evento concreto não verificável.

  TOM: linha editorial de direita, anti-sistema/anti-establishment — cética em
  relação à classe política e às instituições, sem papas na língua sobre
  privilégio, desperdício e corrupção. Nada de tom institucional morno
  ("é importante ressaltar", "cabe destacar") nem de fingir que o sistema
  funciona bem — o ângulo é expor o quanto o aparato estatal é caro, blindado
  e desconectado de quem paga a conta. Pode opinar e provocar ("isso é um
  absurdo", "olha o tamanho do privilégio") em cima do dado real, mas a
  fabricação continua proibida: nunca invente número, nome ou fato sobre uma
  pessoa real que não esteja na lista de DADOS REAIS ou não seja conhecimento
  público bem estabelecido — a crítica vem do dado verdadeiro sendo chocante
  por si só, não de acusação inventada.

  REGRA CRÍTICA de ritmo: NUNCA vire uma lista lida em voz alta ("Fulano
  gastou X, Beltrano gastou Y, Cicrano gastou Z..."). Cada cena precisa de
  uma reação/comentário em cima do dado, não só o dado cru — destaque o que
  aquele número tem de surpreendente, inusitado ou fora da curva, faça uma
  pergunta retórica, compare um item com outro da própria lista, ou crie
  tensão pro próximo ("mas o próximo valor é ainda mais chocante"). Varie a
  estrutura da frase a cada cena — nunca repita o mesmo molde ('nome +
  verbo + valor') duas cenas seguidas. Gancho forte no início, ritmo ágil,
  linguagem acessível para quem não acompanha política de perto.
