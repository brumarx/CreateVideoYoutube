prompt_base: >
  Escreva um roteiro de curiosidades sobre política brasileira. SE houver uma
  seção "DADOS REAIS" abaixo (formato curto): use SOMENTE esses dados (não
  invente nomes, valores ou fatos que não estejam na lista) — o ângulo é
  DINHEIRO + PODER + NOMES, seja direto sobre quem, quanto e onde, sem
  preâmbulo institucional ("hoje vamos falar sobre..."). SE NÃO houver essa
  seção (formato longo, tema sobre COMO O SISTEMA FUNCIONA, não sobre pessoa
  específica): escreva com base no seu conhecimento geral, bem estabelecido e
  público sobre leis e processos brasileiros (o que a CEAP cobre, limites
  legais, como funciona o processo eleitoral etc.) — isso é conhecimento de
  domínio público, não precisa de lista de dados pra ser usado; só não invente
  número específico, nome de pessoa ou evento concreto não verificável.

  TOM: linha editorial de direita, anti-sistema/anti-establishment — cética em
  relação à classe política e às instituições. Nada de tom institucional
  morno ("é importante ressaltar", "cabe destacar") nem de fingir que o
  sistema funciona bem. MAS a provocação vem SEMPRE do número verdadeiro,
  nunca de rótulo: pergunta retórica sem número de fora ("você acha que
  isso faz sentido?", "quem aprovou isso?"), comparação entre dois
  números da própria lista ("o primeiro recebeu quase o dobro do quinto"),
  ou o tamanho do valor dito por extenso. A revisão de fatos reprova (e o
  vídeo não sai) quando o roteiro AFIRMA sem dado: "corrupção", "desvio",
  "roubo", "irregular", "privilégio da classe política", "desperdício",
  "gasto desnecessário", "dinheiro jogado fora", "isso é um absurdo",
  "o Brasil gasta milhões", "jogado fora", "ninguém explica" — nem
  comparação com salário mínimo, orçamento de saúde ou outro país (não
  estão nos dados) — nenhuma dessas palavras/frases aparece no
  roteiro, nem como opinião. Também nunca: somar, subtrair, multiplicar
  (mensal vira anual) ou fazer média
  de valores (a revisão reprova conta errada — use só os números como
  vieram), dizer que alguém é "o mais X da Câmara/do Brasil" (os dados são
  uma lista curta, não o ranking de todos — e o 1º da lista num critério
  pode não ser o 1º em outro), ou escrever nome de pessoa diferente de como
  está nos dados (copie a grafia exata).

  REGRA CRÍTICA de ritmo: NUNCA vire uma lista lida em voz alta ("Fulano
  gastou X, Beltrano gastou Y, Cicrano gastou Z..."). Cada cena precisa de
  uma reação/comentário em cima do dado, não só o dado cru — destaque o que
  aquele número tem de surpreendente, inusitado ou fora da curva, faça uma
  pergunta retórica, compare um item com outro da própria lista, ou crie
  tensão pro próximo ("mas o próximo valor é ainda mais chocante"). Varie a
  estrutura da frase a cada cena — nunca repita o mesmo molde ('nome +
  verbo + valor') duas cenas seguidas. Gancho forte no início, ritmo ágil,
  linguagem acessível para quem não acompanha política de perto.

  REGRA CRÍTICA de comparação: compare SÓ com números que estão nos dados
  reais. Nunca traga de fora salário de outras profissões (médico,
  professor), orçamento de saúde ou educação, ranking de outros países ou o
  total de parlamentares. Nunca diga pra onde o dinheiro vai ou se ele
  "beneficia o povo", se os dados não dizem. Ranking: a posição é só a do
  campo "posicao_no_ranking". Se ele não vier, não diga "primeiro",
  "segundo" etc. Poucos dados rendem um vídeo mais curto, nunca um vídeo
  esticado com informação inventada.

# publica sozinho depois da revisão de fatos (sem esperar "Aprovar" no painel)
require_approval: false
