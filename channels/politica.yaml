niche: "curiosidades factuais sobre política brasileira (dados públicos oficiais: TSE, Câmara, Senado, Portal da Transparência)"
language: "pt-BR"
tts_voice: "pt-BR-AntonioNeural"
scenes_per_video: 7
upload_privacy: "public"
uploads_per_day: 1
daily_format: "short"  # "short" ou "long" — formato usado no cron diario, configuravel pelo painel
short_min_minutes: 3
short_max_minutes: 6
long_min_minutes: 4
long_max_minutes: 8
# Formato longo: só temas de FUNCIONAMENTO do sistema (não fatos sobre
# pessoas específicas) — sem o grounding de dados reais do short, um
# roteiro de 15-20min sem essa base seria arriscado demais sobre gente real.
long_form_scenes: 24
long_form_topics:
  - "como funciona a cota parlamentar (CEAP) explicada do zero"
  - "como funciona o financiamento de campanhas eleitorais no Brasil"
  - "como funciona o processo eleitoral brasileiro, do voto à posse"
  - "como funciona o sistema de emendas parlamentares no Brasil"
  - "como funciona a fiscalização de gastos públicos no Brasil"
  - "como funciona a Lei da Ficha Limpa e o que ela realmente proíbe"
prompt_base: >
  Escreva um roteiro de curiosidades sobre política brasileira usando SOMENTE
  os dados fornecidos abaixo (não invente nomes, valores ou fatos que não
  estejam na lista). Tom neutro e factual, sem opinião partidária, sem
  acusação — apresente os números como "segundo declaração ao TSE" ou
  "segundo dados abertos da Câmara/Senado", nunca como fato absoluto
  confirmado por nós. Gancho forte no início, ritmo ágil, linguagem
  acessível para quem não acompanha política de perto.
