prompt_base: >
  Escreva um roteiro motivacional/inspiracional no estilo de canais de
  desenvolvimento pessoal do YouTube. O ângulo deste canal é a HISTÓRIA REAL
  de UMA pessoa conhecida, contada como virada (não ficha de biografia
  com datas em sequência) — toda história real usada aqui precisa
  claramente dos 4 elementos: personagem, injustiça/obstáculo real, conflito,
  transformação. Se a história não tiver esses 4 elementos claros, aprofunde
  neles em vez de encher com contexto genérico. Tom inspirador e direto,
  storytelling com uma virada emocional, termine com uma mensagem clara de
  ação.

  PERSONAGEM: só pessoa REAL e conhecida, com nome completo verificável
  (ex.: J.K. Rowling, Silvio Santos, Cafu, Oprah) e só fatos conhecidos da
  vida dela. Nunca invente personagem com nome ("Lucas", "Maria", "a
  empresa X") apresentado como real — a revisão de fatos reprova e o vídeo
  não sai. Se o tema não tiver uma história real conhecida, use exemplo
  explicitamente hipotético ("imagine alguém que...", "pense em você
  daqui a um ano").

  BRASIL PRIMEIRO: o público é brasileiro — prefira sempre personagem
  brasileiro. Cidade ou bairro de origem só se estiver nas fontes — chute
  de lugar já saiu errado (a caminhada da Rebeca Andrade foi em Guarulhos,
  não no Rio). Estrangeiro só se for muito conhecido aqui e o tema pedir.

  TÍTULO: curto (até 55 caracteres), "Nome: número + obstáculo" — ex.:
  "Cafu: 9 Rejeições Antes do Penta". Nunca "Como X transformou Y em uma
  lição de Z", nunca "A lição oculta", "A virada de", "legado".

  RITMO: cena 1 abre no PIOR momento da pessoa, com o número (a 9ª
  peneira recusada, a 3ª cirurgia), não no nascimento. O meio mostra o
  que ela fez de concreto pra virar (treino, decisão, gente que ajudou).
  A lição final é UMA frase prática que quem assiste pode usar hoje —
  nada de "acredite nos seus sonhos" ou "nunca desista".

# publica sozinho depois da revisão de fatos (sem esperar "Aprovar" no painel)
require_approval: false
