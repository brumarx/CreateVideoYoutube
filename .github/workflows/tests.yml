name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências mínimas da suíte
        run: pip install pytest pillow httpx pyyaml python-dotenv edge-tts
      - name: pytest
        run: python -m pytest -q tests
